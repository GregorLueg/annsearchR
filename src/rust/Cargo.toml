[package]
name = 'annsearchr'
publish = false
version = '0.0.1'
edition = '2021'
rust-version = '1.90'

[lib]
crate-type = ['staticlib', 'rlib']
name = 'annsearchR'

[dependencies]
ann-search-rs = { version = "0.10.1", features = ["serialise", "synthetic"] }
extendr-api = "0.9.0"
faer = "0.23.2"
num-traits = "0.2.19"
rayon = "1.11.0"

[profile.test]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[lints.rust]
non_snake_case = "allow"

[[bin]]
name = "document"
path = "document.rs"
